<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="saberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D4FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00FF41;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Outer ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#FFE81F" stroke-width="3"/>
  <!-- Inner glow -->
  <circle cx="50" cy="50" r="35" fill="none" stroke="url(#saberGlow)" stroke-width="2" opacity="0.7"/>
  <!-- Letters -->
  <text x="50" y="60" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#FFE81F" text-anchor="middle">AS</text>
</svg>
