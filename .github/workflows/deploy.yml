name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - name: Wait for legacy Pages publishing
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              { owner, repo, per_page: 100 }
            )

            const legacyRun = runs.find((run) =>
              run.head_sha === context.sha &&
              (run.path === 'dynamic/pages/pages-build-deployment' ||
                run.name === 'pages build and deployment')
            )

            if (!legacyRun) {
              core.info('No legacy branch Pages run found; deploying immediately.')
              return
            }

            core.info(`Waiting for legacy Pages run ${legacyRun.id} to finish.`)
            const deadline = Date.now() + 5 * 60 * 1000

            while (Date.now() < deadline) {
              const { data: run } = await github.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: legacyRun.id
              })

              if (run.status === 'completed') {
                core.info(`Legacy Pages run finished with ${run.conclusion}; deploying Vite output last.`)
                return
              }

              await new Promise((resolve) => setTimeout(resolve, 5000))
            }

            core.setFailed(`Legacy Pages run ${legacyRun.id} did not finish within five minutes.`)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
